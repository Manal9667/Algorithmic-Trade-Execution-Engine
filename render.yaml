services:
  - type: web
    name: social-media-policy-monitor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: PERSPECTIVE_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
